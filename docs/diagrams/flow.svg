<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">One make run over architecture-leadership-decision-record in nine rows</title>
<desc id="d">Nine rows run top to bottom across five lanes: adr-toolkit, Use cases, DocumentStore, Parsers and Rules. The command reads settings and builds the store, the use cases list and parse the ADRs, the ADR rules check every record, supersession links are compared, the audiences, reaction log and talk are checked, the decision log is compared with the generated text, and the report is printed. In amber, row 3x: a record with only good news fails with ADR014 and exit 1; row 5x: the worked-example reaction log gives warning REA004, which is not an error. The run ends with OK: 6 documents checked, 0 errors, 1 warnings.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">One make run over the decision record</text>
<text class="caption" x="48" y="100">Row 3x is an error that fails the run; row 5x is the warning the shipped worked example always prints.</text>

<rect class="svc" x="400" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="470" y="158" text-anchor="middle">adr-toolkit</text>
<rect class="svc" x="560" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="620" y="158" text-anchor="middle">Use cases</text>
<rect class="svc" x="705" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="770" y="148" text-anchor="middle">Document</text>
<text class="lane" x="770" y="168" text-anchor="middle">Store</text>
<rect class="svc" x="860" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="920" y="158" text-anchor="middle">Parsers</text>
<rect class="svc" x="1015" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1075" y="158" text-anchor="middle">Rules</text>
<path class="hair" d="M470 176V752M620 176V752M770 176V688M920 176V304M1075 176V626"/>
<path class="hair" d="M66 216V728"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Read settings, build the store</text>
<text class="sub" x="96" y="232">ADR_ROOT, limits, required ADRs</text>
<rect class="slot" x="464" y="198" width="12" height="36" rx="4"/>
<text class="label t-accent" x="486" y="221">settings</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">List the ADRs, parse each</text>
<text class="sub" x="96" y="296">missing parts stay empty</text>
<path class="sync" d="M620 280H770"/>
<text class="label t-accent" x="632" y="270">list, read</text>
<path class="sync" d="M770 280H920"/>
<text class="label t-accent" x="782" y="270">to Adr</text>

<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">ADR rules on every record</text>
<text class="sub" x="96" y="360">header, options, context, size</text>
<path class="sync" d="M620 344H1075"/>
<text class="label t-accent" x="932" y="334">check_adr</text>

<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">A record with only good news</text>
<text class="sub" x="96" y="424">ADR014: no Bad line, exit 1</text>
<path class="fail" d="M1075 408H620"/>
<text class="label t-warn" x="932" y="398">ADR014</text>

<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">Compare supersession links</text>
<text class="sub" x="96" y="488">replaced and successor agree</text>
<rect class="slot" x="614" y="454" width="12" height="36" rx="4"/>
<text class="label t-accent" x="636" y="477">check_links</text>

<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Audiences, reaction, talk</text>
<text class="sub" x="96" y="552">files read, parsed, checked</text>
<path class="sync" d="M620 536H1075"/>
<text class="label t-accent" x="932" y="526">check_reaction</text>

<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="596">REA004 warning, not an error</text>
<text class="sub" x="96" y="616">reaction is a worked example</text>
<path class="fail" d="M1075 600H620"/>
<text class="label t-warn" x="932" y="590">REA004</text>

<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="660">Compare the decision log</text>
<text class="sub" x="96" y="680">generated text vs docs file</text>
<path class="sync" d="M620 664H770"/>
<text class="label t-accent" x="632" y="654">log compare</text>

<circle class="dot-g" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="724">Print the report</text>
<text class="sub" x="96" y="744">exit 1 only if an error</text>
<path class="ok" d="M620 728H470"/>
<text class="label t-good" x="500" y="718">report</text>
<rect class="win" x="650" y="708" width="440" height="40" rx="10"/>
<text class="label b t-good" x="666" y="733">OK: 6 documents checked, 0 errors, 1 warnings</text>

<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
<path class="fail" d="M696 786H760"/><text class="legend" x="772" y="791">failure path</text>
<path class="ok" d="M928 786H992"/><text class="legend" x="1004" y="791">result</text>
</svg>
