<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">Architecture of architecture-leadership-decision-record: documents and the toolkit that lints them</title>
<desc id="d">The repository is a document set and a small toolkit. On the left, inside Documents in the repository: ADR 0007, which supersedes ADR 0005, three audience versions of it, a reaction log that is a worked example and sends a fix back to the record, a generated decision log, and a 361-word talk. On the right, an operator runs make run, which calls the adr-toolkit command in a package that uses the standard library only. The command calls the use cases, which read the documents through the DocumentStore, parse them with the Markdown parsers, apply the Rules with ADR, AUD, REA, TLK and LOG codes, and send findings to the Report, which writes build/report.md and sets an exit code of 0, 1 or 2. The store can also write the decision log back. In amber, a note says the reaction log is a worked example, which raises warning REA004.</desc>
